server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip the usual text-based assets Vite produces.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache hashed, versioned assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router / client-side routing: any path that isn't a real file
    # falls back to index.html so deep links (e.g. /s/AbCd12) work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
